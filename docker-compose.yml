services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
      POSTGRES_DB: qc_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d qc_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://ccdev:ccdev@db:5432/qc_lab
      APP_ENV: docker
      INSPECTOR_TOKEN: token-inspector-001
      REVIEWER_TOKEN: token-reviewer-001
      ADMIN_TOKEN: token-admin-001
    ports:
      - "8000:8000"

volumes:
  pgdata:
